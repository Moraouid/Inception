services:
  mariadb:
    container_name: mariadb
    image: mariadb
    build: ./requirements/mariadb/
    restart: always
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
  
  wordpress:
    container_name: wordpress
    image: wordpress
    build: ./requirements/wordpress/
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    secrets:
      - db_password
      - admin_password
      - user_password
  
  nginx:
    container_name: nginx
    image: nginx
    build: ./requirements/nginx/
    restart: always
    depends_on:
      - wordpress
    networks:
      - inception_network
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html

  redis:
    container_name: redis
    image: redis
    build: ./requirements/bonus/redis/
    restart: always
    networks:
      - inception_network
    ports:
      - "6379:6379"

  ftp:
    container_name: ftp
    image: ftp
    build: ./requirements/bonus/ftp/
    restart: always
    networks:
      - inception_network
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress_data:/var/www/html
    env_file:
      - .env
    secrets:
      - ftp_password

  adminer:
    container_name: adminer
    image: adminer
    build: ./requirements/bonus/adminer/
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception_network

  static_website:
    container_name: static_website
    image: static_website
    build: ./requirements/bonus/static_website/
    restart: always
    depends_on:
      - nginx
    networks:
      - inception_network

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/$USER/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  admin_password:
    file: ../secrets/admin_password.txt
  user_password:
    file: ../secrets/user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt